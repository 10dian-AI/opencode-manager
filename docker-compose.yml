services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-opencode_manager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No published ports: only the app needs to reach the database.

  app:
    image: ghcr.io/10dian-ai/opencode-manager:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opencode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-opencode_manager}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-20}
      POSTGRES_LOCK_POOL_MAX: ${POSTGRES_LOCK_POOL_MAX:-20}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Admin login key and optional client API keys, comma or newline separated.
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY is required}
      API_KEYS: ${API_KEYS:-}
      PROXY_MIN_WORKERS: ${PROXY_MIN_WORKERS:-4}
      PROXY_MAX_WORKERS: ${PROXY_MAX_WORKERS:-32}
      PROXY_QUEUE_LIMIT: ${PROXY_QUEUE_LIMIT:-8192}
      RISK_CONTROL_CHECK_MODEL: ${RISK_CONTROL_CHECK_MODEL:-glm-5.2}
      PROXY_ACCOUNT_CONCURRENCY: ${PROXY_ACCOUNT_CONCURRENCY:-2}
      AUTO_APPLY_REFERRAL_REWARDS: ${AUTO_APPLY_REFERRAL_REWARDS:-false}
      AUTO_CANCEL_SUBSCRIPTION_RENEWAL: ${AUTO_CANCEL_SUBSCRIPTION_RENEWAL:-false}
      AUTO_ENABLE_CHINESE_MODELS: ${AUTO_ENABLE_CHINESE_MODELS:-true}
      CALL_LOG_RETENTION_DAYS: ${CALL_LOG_RETENTION_DAYS:-30}
      OPERATION_LOG_RETENTION_DAYS: ${OPERATION_LOG_RETENTION_DAYS:-90}
      MONITOR_PORT: 3031
    ports:
      # Host port 3030 -> container port 3000.
      - "${APP_PORT:-3030}:3000"
      # Host monitor port -> embedded monitor server.
      - "${MONITOR_PORT:-3031}:3031"

volumes:
  postgres-data:
